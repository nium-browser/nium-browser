<!-- Nium: nova aba (a mesma do Nium Electron). MPL-2.0 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; object-src 'none'; script-src resource: chrome:; style-src resource: chrome: 'unsafe-inline'; img-src data: https: chrome: resource: page-icon:; font-src resource: chrome:;"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="icon" type="image/png" href="chrome://branding/content/icon32.png" />
    <link rel="stylesheet" href="resource://newtab/data/content/nium/newtab.css" />
  </head>
  <body>
    <main class="home-inner">
      <div class="home-topline">
        <span class="date-line"><span class="sun-dot"></span><span id="date-label"></span></span>
        <button class="text-button" id="customize" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          <span id="customize-label">Customize</span>
        </button>
      </div>
      <section class="hero">
        <h1><span id="hero-a">The internet,</span> <em id="hero-b">at your pace.</em></h1>
      </section>
      <form id="home-search-form" class="hero-search" autocomplete="off">
        <span class="search-symbol"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span>
        <input id="home-search" aria-label="Search the internet" placeholder="Where is your curiosity taking you?" />
        <button type="submit" aria-label="Search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <section class="shortcuts-section" aria-label="Shortcuts">
        <div id="shortcuts" class="shortcuts"></div>
      </section>
    </main>
    <dialog id="add-dialog">
      <form method="dialog" id="add-form">
        <h2 id="add-title">Add shortcut</h2>
        <label><span id="lbl-name">Name</span><input name="title" maxlength="40" required /></label>
        <label><span id="lbl-url">Address</span><input name="url" maxlength="2000" required placeholder="example.com" /></label>
        <div class="dialog-buttons">
          <button type="button" class="secondary" id="add-cancel">Cancel</button>
          <button type="submit" class="primary" value="save">Save</button>
        </div>
      </form>
    </dialog>
    <script src="resource://newtab/data/content/nium/newtab.js"></script>
  </body>
</html>
